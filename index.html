<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>毕节市从业人员健康体检合格证系统</title>
  <!-- 引入二维码生成库与 html2canvas 导出库 -->
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    }
    body {
      background-color: #f3f4f6;
      color: #333;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 20px 10px;
    }

    /* 容器样式 */
    .container {
      width: 100%;
      max-width: 500px;
    }

    /* 控制面板样式 */
    .control-panel {
      background: #ffffff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
      margin-bottom: 25px;
    }
    .control-panel h2 {
      font-size: 18px;
      color: #1e3a8a;
      margin-bottom: 15px;
      text-align: center;
      border-bottom: 2px solid #e5e7eb;
      padding-bottom: 8px;
    }
    .form-group {
      margin-bottom: 12px;
    }
    .form-group label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 5px;
      color: #4b5563;
    }
    .form-group input, .form-group select {
      width: 100%;
      padding: 10px;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      font-size: 14px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 15px;
    }
    .btn {
      flex: 1;
      padding: 12px;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
      text-align: center;
    }
    .btn-primary { background: #2563eb; color: #fff; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-success { background: #059669; color: #fff; }
    .btn-success:hover { background: #047857; }

    /* 证书卡片样式 */
    .card-wrapper {
      display: flex;
      justify-content: center;
      width: 100%;
    }
    .cert-card {
      width: 420px;
      height: 270px;
      background: linear-gradient(135deg, #ffffff 0%, #f0fdf4 100%);
      border: 2px solid #059669;
      border-radius: 12px;
      padding: 15px;
      position: relative;
      box-shadow: 0 10px 25px rgba(0,0,0,0.1);
      overflow: hidden;
      box-sizing: border-box;
    }
    /* 卡片背景防伪水印 */
    .cert-card::before {
      content: "毕节健康";
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%) rotate(-30deg);
      font-size: 55px;
      font-weight: 900;
      color: rgba(5, 150, 105, 0.06);
      white-space: nowrap;
      pointer-events: none;
    }
    .cert-header {
      text-align: center;
      border-bottom: 2px solid #059669;
      padding-bottom: 6px;
      margin-bottom: 12px;
    }
    .cert-title {
      font-size: 18px;
      font-weight: bold;
      color: #065f46;
      letter-spacing: 1px;
    }
    .cert-subtitle {
      font-size: 10px;
      color: #047857;
      margin-top: 2px;
    }

    .cert-body {
      display: flex;
      justify-content: space-between;
      gap: 10px;
    }
    .cert-info {
      flex: 1;
      font-size: 12px;
      line-height: 1.8;
      color: #1f2937;
    }
    .cert-info p span.label {
      color: #4b5563;
      font-weight: 600;
    }
    .cert-info p span.val {
      color: #111827;
      font-weight: bold;
    }

    /* 一寸照片与二维码区域 */
    .cert-media {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      width: 100px;
    }
    .photo-box {
      width: 85px;
      height: 115px;
      border: 1px solid #9ca3af;
      background: #f9fafb;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      border-radius: 4px;
    }
    .photo-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .qr-box {
      width: 70px;
      height: 70px;
      margin-top: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .qr-box canvas, .qr-box img {
      width: 100% !important;
      height: 100% !important;
    }

    /* 公章标记 */
    .cert-stamp {
      position: absolute;
      bottom: 15px;
      right: 120px;
      width: 80px;
      height: 80px;
      border: 2px solid rgba(220, 38, 38, 0.7);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      color: rgba(220, 38, 38, 0.7);
      font-size: 10px;
      font-weight: bold;
      text-align: center;
      transform: rotate(-15deg);
      pointer-events: none;
      line-height: 1.2;
    }

    /* 核验模式独立样式 */
    .verify-container {
      background: #fff;
      border-radius: 12px;
      padding: 25px 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 450px;
      text-align: center;
      display: none;
    }
    .verify-badge {
      display: inline-block;
      background: #d1fae5;
      color: #065f46;
      padding: 8px 16px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 16px;
      margin-bottom: 20px;
      border: 1px solid #34d399;
    }
    .verify-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      margin-top: 10px;
    }
    .verify-table th, .verify-table td {
      padding: 10px 8px;
      border-bottom: 1px solid #e5e7eb;
      font-size: 14px;
    }
    .verify-table th {
      color: #6b7280;
      width: 35%;
    }
    .verify-table td {
      color: #111827;
      font-weight: 600;
    }
    .verify-footer {
      margin-top: 20px;
      font-size: 12px;
      color: #9ca3af;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- 1. 制作与控制面板 (核验模式下自动隐藏) -->
    <div class="control-panel" id="controlPanel">
      <h2>毕节市从业人员健康证书生成器</h2>
      <div class="form-group">
        <label>姓名：</label>
        <input type="text" id="inputName" value="张三" placeholder="请输入姓名">
      </div>
      <div class="form-group">
        <label>性别：</label>
        <select id="inputGender">
          <option value="男">男</option>
          <option value="女">女</option>
        </select>
      </div>
      <div class="form-group">
        <label>年龄：</label>
        <input type="number" id="inputAge" value="28" placeholder="请输入年龄">
      </div>
      <div class="form-group">
        <label>一寸照片（支持iPhone/各种相机图片）：</label>
        <input type="file" id="inputPhoto" accept="image/*">
      </div>
      <div class="btn-group">
        <button class="btn btn-primary" onclick="generateNewCert()">重新生成不重复编号</button>
        <button class="btn btn-success" onclick="saveAsImage()">一键保存高清图片</button>
      </div>
    </div>

    <!-- 2. 预览展示卡片 (制作模式显示) -->
    <div class="card-wrapper" id="cardWrapper">
      <div class="cert-card" id="certCard">
        <div class="cert-header">
          <div class="cert-title">毕节市从业人员健康体检合格证</div>
          <div class="cert-subtitle">BIJIE HEALTH EXAMINATION CERTIFICATE</div>
        </div>
        <div class="cert-body">
          <div class="cert-info">
            <p><span class="label">姓　　名：</span><span class="val" id="cardName">张三</span></p>
            <p><span class="label">性　　别：</span><span class="val" id="cardGender">男</span></p>
            <p><span class="label">年　　龄：</span><span class="val" id="cardAge">28</span></p>
            <p><span class="label">证件编号：</span><span class="val" id="cardCode">BJWN000000</span></p>
            <p><span class="label">发证日期：</span><span class="val" id="cardIssueDate">2026-03-30</span></p>
            <p><span class="label">有效期限：</span><span class="val" id="cardExpiryDate">2027-03-29</span></p>
            <p><span class="label">体检单位：</span><span class="val">威宁县人民医院</span></p>
          </div>
          <div class="cert-media">
            <div class="photo-box">
              <img id="cardPhoto" src="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='85' height='115' viewBox='0 0 85 115'><rect width='100%' height='100%' fill='%23e5e7eb'/><text x='50%' y='50%' dominant-baseline='middle' text-anchor='middle' font-size='12' fill='%239ca3af'>一寸照片</text></svg>" alt="寸照">
            </div>
            <div class="qr-box" id="qrcode"></div>
          </div>
        </div>
        <!-- 模拟电子公章 -->
        <div class="cert-stamp">
          威宁县人民医院<br>体检专用章
        </div>
      </div>
    </div>

    <!-- 3. 二次扫码专属【核验结果页面】 (制作面板与卡片均隐藏，仅展示此部分) -->
    <div class="verify-container" id="verifyContainer">
      <div class="verify-badge">✓ 官方核验真实有效 (体检合格)</div>
      <table class="verify-table">
        <tr><th>姓名</th><td id="vName">-</td></tr>
        <tr><th>性别</th><td id="vGender">-</td></tr>
        <tr><th>年龄</th><td id="vAge">-</td></tr>
        <tr><th>证件编号</th><td id="vCode">-</td></tr>
        <tr><th>体检结果</th><td style="color:#059669; font-weight:bold;">合格 (准予从业)</td></tr>
        <tr><th>发证日期</th><td id="vIssueDate">-</td></tr>
        <tr><th>有效期限</th><td id="vExpiryDate">-</td></tr>
        <tr><th>体检医院</th><td>威宁县人民医院</td></tr>
      </table>
      <div class="verify-footer">
        毕节市从业人员健康体检信息数据库查询系统<br>核验时间：<span id="verifyTime"></span>
      </div>
    </div>
  </div>

  <script>
    // 基础配置
    const STORAGE_KEY = "BJWN_USED_CODES";

    // 获取已使用过的编号集合
    function getUsedCodes() {
      const stored = localStorage.getItem(STORAGE_KEY);
      return stored ? JSON.parse(stored) : [];
    }

    // 保存已使用的编号
    function addUsedCode(code) {
      const used = getUsedCodes();
      used.push(code);
      localStorage.setItem(STORAGE_KEY, JSON.stringify(used));
    }

    // 生成不重复的 BJWN+6位数字 编号
    function generateUniqueCode() {
      const usedCodes = getUsedCodes();
      let newCode = "";
      let isUnique = false;
      let count = 0;

      while (!isUnique && count < 10000) {
        const randomDigits = Math.floor(100000 + Math.random() * 900000);
        newCode = "BJWN" + randomDigits;
        if (!usedCodes.includes(newCode)) {
          isUnique = true;
        }
        count++;
      }
      addUsedCode(newCode);
      return newCode;
    }

    // 格式化日期 YYYY-MM-DD
    function formatDate(date) {
      const y = date.getFullYear();
      const m = String(date.getMonth() + 1).padStart(2, '0');
      const d = String(date.getDate()).padStart(2, '0');
      return `${y}-${m}-${d}`;
    }

    // 全局当前数据
    let currentCertData = {};

    // 刷新与生成卡片逻辑
    function updateCardData(keepCode = false) {
      const name = document.getElementById("inputName").value.trim() || "张三";
      const gender = document.getElementById("inputGender").value;
      const age = document.getElementById("inputAge").value || "28";

      // 日期计算（发证日期为当前时间，有效期为1年）
      const now = new Date();
      const issueDateStr = formatDate(now);
      const nextYear = new Date();
      nextYear.setFullYear(now.getFullYear() + 1);
      nextYear.setDate(nextYear.getDate() - 1);
      const expiryDateStr = formatDate(nextYear);

      // 编号逻辑
      let code = currentCertData.code;
      if (!keepCode || !code) {
        code = generateUniqueCode();
      }

      currentCertData = {
        name, gender, age, code,
        issueDate: issueDateStr,
        expiryDate: expiryDateStr
      };

      // 渲染页面卡片
      document.getElementById("cardName").innerText = name;
      document.getElementById("cardGender").innerText = gender;
      document.getElementById("cardAge").innerText = age;
      document.getElementById("cardCode").innerText = code;
      document.getElementById("cardIssueDate").innerText = issueDateStr;
      document.getElementById("cardExpiryDate").innerText = expiryDateStr;

      // 生成二维码 (二次扫码带参数验证)
      const baseUrl = window.location.href.split('?')[0];
      const verifyUrl = `${baseUrl}?mode=verify&name=${encodeURIComponent(name)}&gender=${encodeURIComponent(gender)}&age=${age}&code=${code}&issue=${issueDateStr}&exp=${expiryDateStr}`;

      const qrContainer = document.getElementById("qrcode");
      qrContainer.innerHTML = "";
      QRCode.toCanvas(verifyUrl, { width: 70, margin: 1 }, function (err, canvas) {
        if (!err) qrContainer.appendChild(canvas);
      });
    }

    // 重新生成按钮处理
    function generateNewCert() {
      updateCardData(false);
    }

    // 照片上传处理 (支持 iPhone 及各类图片格式)
    document.getElementById("inputPhoto").addEventListener("change", function(e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(evt) {
          document.getElementById("cardPhoto").src = evt.target.result;
        };
        reader.readAsDataURL(file);
      }
    });

    // 绑定输入框即时变化
    document.getElementById("inputName").addEventListener("input", () => updateCardData(true));
    document.getElementById("inputGender").addEventListener("change", () => updateCardData(true));
    document.getElementById("inputAge").addEventListener("input", () => updateCardData(true));

    // 保存为高清图片
    function saveAsImage() {
      const certElement = document.getElementById("certCard");
      html2canvas(certElement, {
        scale: 3, // 提高导出清晰度
        useCORS: true,
        backgroundColor: null
      }).then(canvas => {
        const link = document.createElement('a');
        link.download = `毕节健康体检合格证_${currentCertData.name}_${currentCertData.code}.png`;
        link.href = canvas.toDataURL('image/png');
        link.click();
      });
    }

    // 页面初始化：识别是“生成/编辑模式”还是“二次扫码核验模式”
    window.addEventListener("DOMContentLoaded", () => {
      const urlParams = new URLSearchParams(window.location.search);
      const isVerify = urlParams.get('mode') === 'verify';

      if (isVerify) {
        // --- 模式：二次扫码核验 (隐藏控制面板与卡片，只显示核验结果) ---
        document.getElementById("controlPanel").style.display = "none";
        document.getElementById("cardWrapper").style.display = "none";
        document.getElementById("verifyContainer").style.display = "block";

        document.getElementById("vName").innerText = urlParams.get('name') || "-";
        document.getElementById("vGender").innerText = urlParams.get('gender') || "-";
        document.getElementById("vAge").innerText = urlParams.get('age') || "-";
        document.getElementById("vCode").innerText = urlParams.get('code') || "-";
        document.getElementById("vIssueDate").innerText = urlParams.get('issue') || "-";
        document.getElementById("vExpiryDate").innerText = urlParams.get('exp') || "-";

        const now = new Date();
        document.getElementById("verifyTime").innerText = now.toLocaleString();
      } else {
        // --- 模式：生成与制作页面 ---
        updateCardData(false);
      }
    });
  </script>
</body>
</html>
